name: Build executables

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux x86_64
            artifact_name: Ani-Watch-Linux-x86_64
            artifact_path: dist/Ani-Watch-Linux-x86_64.tar.gz
          - os: windows-2022
            label: Windows x86_64
            artifact_name: Ani-Watch-Windows-x86_64
            artifact_path: dist/Ani-Watch-Windows-x86_64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run tests
        run: python -m unittest -v

      - name: Build one-file executable
        run: python -m PyInstaller --clean --noconfirm Ani-Watch.spec

      - name: Mark Linux executable
        if: runner.os == 'Linux'
        run: chmod +x dist/Ani-Watch

      - name: Package Linux executable
        if: runner.os == 'Linux'
        run: tar -C dist -czf dist/Ani-Watch-Linux-x86_64.tar.gz Ani-Watch

      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Ani-Watch.exe -DestinationPath dist/Ani-Watch-Windows-x86_64.zip

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
